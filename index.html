<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codex Cloud - Fast File Upload</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-container">
        <h1>CODEX CLOUD</h1>
        <p>Upload any file & get a direct download link</p>

        <div class="drop-zone" id="drop-zone">
            <span class="prompt">Click or Drag & Drop File Here</span>
            <input type="file" id="file-input" class="file-input">
        </div>

        <div id="file-info" class="hidden">
            <p id="file-name"></p>
            <div class="progress-bar">
                <div id="progress" class="progress"></div>
            </div>
        </div>

        <button id="upload-btn" class="upload-btn">GENERATE LINK</button>

        <div id="result" class="hidden">
            <p>Upload Complete!</p>
            <input type="text" id="download-link" readonly>
            <button onclick="copyLink()" class="copy-btn">Copy Link</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
